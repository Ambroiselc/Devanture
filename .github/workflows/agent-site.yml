# Pedro, l'agent des sites définitifs (30/10) : du contenu envoyé par le client à son site, puis la mise en ligne.
# • Fiche du client (page Clients) : boutons « Préparer le site » et « Mettre en ligne » ;
#   ou GitHub > onglet Actions > « Pedro — sites des clients » > Run workflow.
# • Automatique : tous les jours ouvrés à 9 h 47 (Paris), les clients dont le contenu est arrivé reçoivent leur aperçu.
#   Rien n'est envoyé au client sans ta validation (l'e-mail d'aperçu attend sur la page Inès).
#
# Secrets : SUPABASE_DB_URL, ANTHROPIC_API_KEY, NEXT_PUBLIC_SUPABASE_URL (déjà en place),
# SUPABASE_SECRET_KEY (NOUVEAU : clé secrète Supabase, pour les photos), CLOUDFLARE_API_TOKEN et
# CLOUDFLARE_ACCOUNT_ID (déjà en place ; la clé doit avoir « DNS : Edit »). Procédure : docs/sites-clients.md.

name: Pedro — sites des clients

on:
  # 20/11 : plus de créneau programmé GitHub (il les lançait avec des heures de retard ou pas du tout).
  # Lancé à l'heure par le Worker Cloudflare « devanture-reveil » (workers/reveil/src/index.ts) : 47 8 * * 1-5 (UTC).
  workflow_dispatch:
    inputs:
      client:
        description: "Identifiant du client (fiche Clients). Vide = tous les clients dont le contenu est arrivé."
        type: string
        default: ""
      en_ligne:
        description: "Mettre ce client en ligne sur son domaine (après sa validation écrite et le branchement du domaine)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier les secrets
        run: |
          for s in SUPABASE_DB_URL ANTHROPIC_API_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SECRET_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Le secret $s manque (voir docs/sites-clients.md)."; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: |
          npm ci --no-audit --no-fund
          npm i --no-save --no-audit --no-fund sharp
          # Photos d'iPhone (HEIC) converties en JPEG.
          sudo apt-get update -qq && sudo apt-get install -y -qq libheif-examples

      - name: Lancer Pedro
        env:
          CLIENT: ${{ inputs.client }}
          EN_LIGNE: ${{ inputs.en_ligne }}
        run: |
          if [ "$EN_LIGNE" = "true" ]; then
            if [ -z "$CLIENT" ]; then echo "::error::Pour une mise en ligne, indiquer l'identifiant du client."; exit 1; fi
            node agents/site.ts --en-ligne "$CLIENT"
          elif [ -n "$CLIENT" ]; then
            node agents/site.ts --client "$CLIENT"
          else
            node agents/site.ts --tout
          fi
